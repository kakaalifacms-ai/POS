
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Data - Kasir Cemerlang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <header class="topbar">
    <div>
      <h1>CRUD Data</h1>
      <p>Manajemen menu dan penjual</p>
    </div>
  </header>

  <section class="panel">
    <h2>Identitas Penjual</h2>
    <p class="description">Daftarkan identitas penjual sebelum menambahkan menu.</p>

    <form id="form-penjual">
      <label for="penjual-id-baru">ID Penjual</label>
      <input id="penjual-id-baru" type="text" placeholder="Contoh: P001" required>

      <label for="penjual-nama-baru">Nama Penjual</label>
      <input id="penjual-nama-baru" type="text" placeholder="Masukkan nama penjual" required>

      <button type="submit" class="btn-primary">Tambah Penjual</button>
    </form>

    <h3 class="subheading">Data Penjual</h3>
    <div id="daftar-penjual">
      <p class="loading-text">Memuat data penjual...</p>
    </div>
  </section>

  <section class="panel">
    <h2>Form Menu</h2>
    <p class="description">Tambahkan atau ubah informasi menu.</p>

    <form id="form-crud-menu">
      <input type="hidden" id="crud-menu-id">
      <input type="hidden" id="crud-gambar-lama">

      <label for="crud-penjual-id">Pemilik Menu</label>
      <select id="crud-penjual-id" required>
        <option value="">Pilih penjual</option>
      </select>

      <label for="crud-nama">Nama Menu</label>
      <input id="crud-nama" type="text" placeholder="Contoh: Nasi Goreng" required>

      <label for="crud-harga">Harga Menu</label>
      <input id="crud-harga" type="number" min="1" placeholder="Contoh: 15000" required>

      <label for="crud-gambar-file">Gambar Menu dari Galeri</label>
      <input id="crud-gambar-file" type="file" accept="image/*">

      <div id="preview-container" class="preview-box hidden">
        <p>Pratinjau gambar</p>
        <img id="crud-preview" alt="Pratinjau gambar menu">
      </div>

      <div class="button-row">
        <button type="submit" id="btn-simpan-crud" class="btn-primary">
          Simpan Menu
        </button>
        <button type="button" id="btn-batal-edit" class="btn-reset">
          Bersihkan
        </button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="section-heading">
      <div>
        <h2>Data Menu</h2>
        <p class="description">Daftar menu yang tersimpan di database.</p>
      </div>
    </div>

    <div id="daftar-crud-menu">
      <p class="loading-text">Memuat menu...</p>
    </div>
  </section>

</div>

<script type="module" src="kelola.js"></script>
</body>
</html>
