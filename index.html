<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kasir cemerlang</title>
  
 
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🛒kasir cemerlang</h1>
    
    <!-- menu grid 2 kolom -->
 <div class="menu-grid">

  <button class="menu-btn" onclick="tambahkeKeranjang('mie ayam', 15000)">
    <img src="gambar/mieayam2.jpg" alt="Mie Ayam">
    Mie Ayam 🍜
    <span class="harga-menu">Rp15.000</span>
  </button>

  <button class="menu-btn" onclick="tambahkeKeranjang('ayam', 30000)">
    <img src="gambar/ayam-geprek.jpg" alt="Ayam Geprek">
    Ayam Geprek Jago 🍗
    <span class="harga-menu">Rp30.000</span>
  </button>

  <button class="menu-btn" onclick="tambahkeKeranjang('nasi goreng', 15000)">
    <img src="gambar/nasi-goreng.jpg" alt="Nasi Goreng">
    Nasi Goreng Pedas 🍛
    <span class="harga-menu">Rp15.000</span>
  </button>

  <button class="menu-btn" onclick="tambahkeKeranjang('es teh manis', 5000)">
    <img src="gambar/es-teh.jpg" alt="Es Teh">
    Es Teh Manis 🍹
    <span class="harga-menu">Rp5.000</span>
  </button>

  <button class="menu-btn" onclick="tambahkeKeranjang('donat', 5000)">
    <img src="gambar/donat.jpg" alt="Donat">
    Donat 🍩
    <span class="harga-menu">Rp5.000</span>
  </button>

  <button class="menu-btn" onclick="tambahkeKeranjang('sate kambing', 25000)">
    <img src="gambar/sate-kambing.jpg" alt="Sate Kambing">
    Sate Kambing 🐐
    <span class="harga-menu">Rp25.000</span>
  </button>

</div>
    
    <!---ringkas total dan aksi bayar/reset-->
    <div class="summary-box">
      <h3>Total tagihan</h3>
      <div id="total-harga" class="total-teks">Rp. 0</div>
      <div class="action-btns">
        <button id="btn-bayar" class="btn-main" disabled>buat QR</button>
        <button id="btn-reset" class="btn-reset" onclick="resetKeranjang()">reset</button>
      </div>
    </div>
    
    <!---area tampil qr code--->
    <div id="qr-section" class="hidden">
      <h3>ID <span id="tx-id-display">-</span></h3>
      <canvas id="qr-canvas"></canvas>
      <div id="status-box"  class="status-box status-pending">
        Status: <strong id="status-teks">Menunggu pembayaran...</strong>
      </div>
    </div>
  </div>
<script type="module" src="main.js"></script>
</body>
</html>
